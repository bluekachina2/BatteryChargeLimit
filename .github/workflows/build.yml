name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ motorola-edge50pro ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # JDK 17 only for the Android SDK setup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      # Switch to JDK 8 for the old Gradle build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Create dummy keystore.properties (debug build only)
        run: |
          mkdir -p private
          printf 'storeFile=dummy.jks\nstorePassword=dummy\nkeyAlias=dummy\nkeyPassword=dummy\n' > private/keystore.properties

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: batterychargelimit-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
