name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ motorola-edge50pro ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # JDK 17 only for the Android SDK setup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # Switch to JDK 8 for the old Gradle build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: batterychargelimit-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
