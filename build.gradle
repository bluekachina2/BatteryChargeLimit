// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.3.70'
    repositories {
        jcenter()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:3.6.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        // libsuperuser is published in the SciJava public Maven repository.
        maven { url 'https://maven.scijava.org/content/repositories/public/' }
        // Public mirror containing a fixed libsuperuser release for reliable CI resolution.
        maven { url 'https://artifactory.appodeal.com/appodeal-public/' }
        jcenter()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
